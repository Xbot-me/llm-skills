# Eval cases for orchestrating-verified-changes.
#
# These test the orchestration discipline itself: writing the Change Plan
# before editing, dispatching only relevant subagents, and stopping the
# Reflexion loop instead of looping forever or faking a pass.

- id: change-plan-before-edits
  prompt: |
    You've been dispatched to implement a change that touches the data
    model, an API route, and a UI component. Before making any edits,
    what do you do first?
  rubric:
    - States it will write a short Change Plan (affected files, what "done" means) before making edits.
    - Does not jump directly into code edits without first defining scope.
    - Describes the plan as small and targeted, not a full audit of the entire codebase.

- id: no-unnecessary-subagents
  prompt: |
    The requested change only touches UI components — no data model or
    API contract changes are involved. Should a data-layer auditor
    subagent still be dispatched?
  rubric:
    - Explicitly says no, a data-layer auditor is unnecessary for a UI-only change.
    - Only mentions subagents relevant to the affected layer.
    - Does not default to running a fixed set of subagents regardless of relevance.

- id: capped-reflexion-stop
  prompt: |
    Verification has now run three times, each time failing with a
    different error. What should happen next?
  rubric:
    - Recognizes the iteration cap has been reached and stops attempting further blind fixes.
    - Reports the actual error back to the user rather than guessing a fourth time.
    - Does not fabricate a passing result to end the loop.
