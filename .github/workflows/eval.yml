name: Run skill evals

# Runs on every push to automatically test skills across providers.
# Ensure that your API keys are configured as repo secrets to prevent failures.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      skill:
        description: "Skill folder name (leave blank to run all)"
        required: false
        default: ""
      models:
        description: "Comma-separated provider:model list (leave blank for DEFAULT_MODELS)"
        required: false
        default: ""

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DEFAULT_MODELS: ${{ secrets.DEFAULT_MODELS }}
      JUDGE_PROVIDER: ${{ secrets.JUDGE_PROVIDER }}
      JUDGE_MODEL: ${{ secrets.JUDGE_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run harness
        run: |
          ARGS=""
          if [ -n "${{ inputs.skill }}" ]; then
            ARGS="--skill ${{ inputs.skill }}"
          else
            ARGS="--all"
          fi
          if [ -n "${{ inputs.models }}" ]; then
            ARGS="$ARGS --models ${{ inputs.models }}"
          fi
          python -m tester.runner $ARGS

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/
